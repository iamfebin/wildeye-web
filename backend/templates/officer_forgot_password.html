<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Forgot Officer Password</title>
    <!-- Add any CSS styling if needed -->
    <style>
        body { font-family: sans-serif; margin: 20px; }
        .container { width: 300px; margin: 50px auto; padding: 20px; border: 1px solid #ccc; border-radius: 5px; }
        label { display: block; margin-bottom: 5px; }
        input[type="text"], input[type="email"] { width: 95%; padding: 8px; margin-bottom: 10px; border-radius: 3px; border: 1px solid #ddd; }
        button { padding: 10px 15px; background-color: #007bff; color: white; border: none; border-radius: 3px; cursor: pointer; }
        button:hover { background-color: #0056b3; }
        .message { margin-top: 15px; padding: 10px; border-radius: 3px; }
        .error { background-color: #f8d7da; color: #721c24; border: 1px solid #f5c6cb; }
        .success { background-color: #d4edda; color: #155724; border: 1px solid #c3e6cb; }
        a { color: #007bff; text-decoration: none; }
        a:hover { text-decoration: underline; }
    </style>
</head>
<body>
    <div class="container">
        <h2>Forgot Officer Password?</h2>
        <p>Enter your username or registered email address. If a match is found, a password reset link will be sent to the officer's email.</p>
        
        <form method="post" action="{% url 'officer_forgot_password_request' %}">
            {% csrf_token %}
            <div>
                <label for="identifier">Email or Username:</label>
                <input type="text" id="identifier" name="identifier" required>
            </div>
            <button type="submit">Send Reset Link</button>
        </form>
        <br>
        <p><a href="{% url 'login' %}">Back to Login</a></p>
    </div>
</body>
</html>
