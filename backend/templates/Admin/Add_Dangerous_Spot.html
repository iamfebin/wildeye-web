<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml">
<head>
<meta http-equiv="Content-Type" content="text/html; charset=iso-8859-1" />
<title>Untitled Document</title>
</head>

<body>
<form action="/admin_add_dangerous_spot_post" method="post" enctype="multipart/form-data" name="form1" id="form1">
  <table width="200" border="1">
    <tr>
      <td>Name</td>
      <td>
        <input type="text" name="name" required pattern="^[a-zA-Z\s]+$" title="Please enter only letters and spaces."/>
      </td>
    </tr>
    <tr>
      <td>Latitude</td>
      <td>
        <input type="number" name="latitude" required min="-90" max="90" step="any" title="Enter a valid latitude (-90 to 90)."/>
      </td>
    </tr>
    <tr>
      <td>Longitude</td>
      <td>
        <input type="number" name="longitude" required min="-180" max="180" step="any" title="Enter a valid longitude (-180 to 180)."/>
      </td>
    </tr>
    <tr>
      <td>Date</td>
      <td>
        <input type="date" name="date" required/>
      </td>
    </tr>
    <tr>
      <td colspan="2">
        <div align="center">
          <input type="submit" name="Submit" value="Add"/>
        </div>
      </td>
    </tr>
  </table>
</form>
