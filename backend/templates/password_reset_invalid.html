<!DOCTYPE html>
<html>
<head>
    <title>Invalid Password Reset Link</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; text-align: center; }
        .container { max-width: 500px; margin: auto; padding: 20px; border: 1px solid #ddd; border-radius: 5px; }
        .error { color: red; font-weight: bold; }
    </style>
</head>
<body>
    <div class="container">
        <h2>Invalid Link</h2>
        <p class="error">{{ message }}</p>
        <p>Please ensure you are using the most recent password reset link, or request a new one.</p>
        <p><a href="{{ FRONTEND_RESET_URL_BASE }}" target="_blank">Request New Password Reset</a></p>
    </div>
</body>
</html>
